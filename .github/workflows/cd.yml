# ============================================================
#  CD — Livraison Continue
#  Déclenché uniquement sur push vers main
#  Requiert l'approbation manuelle avant le déploiement
# ============================================================

name: CD Pipeline

on:
  push:
    branches: [main]

jobs:

  # ──────────────────────────────────────────────
  # JOB 1 — Vérification avant déploiement
  # ──────────────────────────────────────────────
  pre-deploy-check:
    name: "Vérification pré-déploiement"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer et builder le frontend
        run: |
          npm ci
          npm run build
        working-directory: frontend

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Vérifier le backend
        run: |
          pip install fastapi pydantic pandas numpy \
                      scikit-learn python-jose[cryptography] bcrypt uvicorn
          python -m py_compile backend/main.py
          echo "Backend OK"

      - name: Uploader les artefacts
        uses: actions/upload-artifact@v4
        with:
          name: build-ready
          path: frontend/dist/
          retention-days: 1

  # ──────────────────────────────────────────────
  # JOB 2 — Approbation manuelle (environnement protégé)
  # Configurer dans GitHub > Settings > Environments > production
  # Ajouter des "Required reviewers"
  # ──────────────────────────────────────────────
  approval:
    name: "Approbation manuelle"
    runs-on: ubuntu-latest
    needs: pre-deploy-check
    environment: production

    steps:
      - name: Approbation accordée
        run: echo "Déploiement approuvé — lancement en production"

  # ──────────────────────────────────────────────
  # JOB 3 — Déploiement (après approbation)
  # ──────────────────────────────────────────────
  deploy:
    name: "Déploiement en production"
    runs-on: ubuntu-latest
    needs: approval

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Télécharger les artefacts du build
        uses: actions/download-artifact@v4
        with:
          name: build-ready
          path: frontend/dist/

      - name: Déploiement du backend
        run: |
          echo "Déploiement du backend FastAPI..."
          echo "Commande réelle : ssh user@server 'cd /app && git pull && pip install -r requirements.txt && systemctl restart pfa-backend'"

      - name: Déploiement du frontend
        run: |
          echo "Déploiement du frontend React..."
          echo "Commande réelle : rsync -avz frontend/dist/ user@server:/var/www/pfa/"

      - name: Notification de succès
        run: |
          echo "Déploiement terminé avec succès"
          echo "Backend  : http://votre-serveur:8000"
          echo "Frontend : http://votre-serveur"
