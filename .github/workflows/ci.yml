# ============================================================
#  CI — Intégration Continue
#  Déclenché sur chaque PR et push vers main / develop
# ============================================================

name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:

  # ──────────────────────────────────────────────
  # JOB 1 — Vérification du backend Python
  # ──────────────────────────────────────────────
  backend-lint:
    name: "Backend — Lint & Syntax"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Installer les dépendances légères
        run: |
          pip install --upgrade pip
          pip install flake8 fastapi pydantic pandas numpy \
                      scikit-learn python-jose[cryptography] bcrypt uvicorn

      - name: Lint flake8 (PEP8 + erreurs syntaxe)
        run: |
          flake8 backend/ \
            --max-line-length=120 \
            --exclude=backend/__pycache__,backend/routes/__pycache__ \
            --ignore=E302,W503

      - name: Vérification syntaxe Python (py_compile)
        run: |
          python -m py_compile backend/main.py
          python -m py_compile backend/data_loader.py
          python -m py_compile backend/model.py
          python -m py_compile backend/auth.py
          python -m py_compile backend/dependencies.py
          python -m py_compile backend/schemas.py
          for f in backend/routes/*.py; do
            python -m py_compile "$f"
          done
          echo "Syntaxe OK sur tous les fichiers backend"

  # ──────────────────────────────────────────────
  # JOB 2 — Tests API backend (sans PyTorch)
  # ──────────────────────────────────────────────
  backend-test:
    name: "Backend — Tests unitaires"
    runs-on: ubuntu-latest
    needs: backend-lint

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Installer les dépendances de test
        run: |
          pip install --upgrade pip
          pip install pytest httpx fastapi pydantic pandas numpy \
                      scikit-learn python-jose[cryptography] bcrypt uvicorn

      - name: Lancer les tests
        run: |
          cd backend
          pytest tests/ -v --tb=short
        env:
          JWT_SECRET_KEY: "ci-test-secret-key-not-for-prod"

  # ──────────────────────────────────────────────
  # JOB 3 — Build frontend React/Vite
  # ──────────────────────────────────────────────
  frontend-build:
    name: "Frontend — Build Vite"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances npm
        run: npm ci
        working-directory: frontend

      - name: Build de production
        run: npm run build
        working-directory: frontend

      - name: Uploader les artefacts du build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7
